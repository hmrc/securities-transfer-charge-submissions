include "backend.conf"

# This is the main configuration file for the application.
# ~~~~~

appName = securities-transfer-charge-submissions

# Default local runtime port for this service
microservice.port = 30034
play.server.http.port = ${microservice.port}

# Default http client
play.modules.enabled += "uk.gov.hmrc.play.bootstrap.HttpClientV2Module"

# Play Modules
play.modules.enabled += "uk.gov.hmrc.securitiestransferchargesubmissions.Module"


# The application languages
# ~~~~~
play.i18n.langs = ["en"]

# Router
# ~~~~~
# Define the Router object to use for this application.
# This router will be looked up first when the application is starting up,
# so make sure this is the entry point.
# Furthermore, it's assumed your route file is named properly.
# So for an application router like `my.application.Router`,
# you may need to define a router file `conf/my.application.routes`.
# Default to Routes in the root package (and conf/routes)
# !!!WARNING!!! DO NOT CHANGE THIS ROUTER
play.http.router = prod.Routes

# Controller
# ~~~~~
# By default all controllers will have authorisation, logging and
# auditing (transaction monitoring) enabled.
# The below controllers are the default exceptions to this rule.


# Microservice specific config


microservice {
  services {
    auth {
      host = localhost
      port = 8500
    }

    etmp-transaction {
      # Prefer stamp-taxes-on-shares-stubs wiring when running via service-manager.
      # Falls back to localhost:11001 for local/manual runs.
      host = localhost
      host = ${?MICROSERVICE_SERVICES_ETMP_TRANSACTION_HOST}
      host = ${?MICROSERVICE_SERVICES_STAMP_TAXES_ON_SHARES_STUBS_HOST}

      port = 11001
      port = ${?MICROSERVICE_SERVICES_ETMP_TRANSACTION_PORT}
      port = ${?MICROSERVICE_SERVICES_STAMP_TAXES_ON_SHARES_STUBS_PORT}
      protocol = "http"
      originating-system = "MDTP-STC"
      transmitting-system = "HIP"

      create {
        max-retries = 2
        initial-backoff-ms = 200
        max-records-per-request = 12
        max-concurrent-calls = 3
      }
    }
  }
}
