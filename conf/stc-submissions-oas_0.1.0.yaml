openapi: 3.0.3
info:
  title: Securities Transfer Charge Submissions API
  version: 0.1.0
  description: |
    API for submitting one or more STC transfer records for downstream ETMP create processing.

    Notes:
    - `submissionId` is supplied as a path parameter.
    - `correlation-id` and `subscription-id` are required request headers.
    - Validation failures are returned as HTTP 400 with an `ApiErrorResponse` body.
    - Successful responses always return a JSON array of charge outcomes.
servers:
  - url: http://localhost:30034
    description: Local direct service port
  - url: http://localhost:30034/securities-transfer-charge-submissions
    description: Local route with service prefix
paths:
  /submission/{submissionId}:
    post:
      summary: Submit one or more STC transfers
      operationId: submitTransfers
      parameters:
        - name: submissionId
          in: path
          required: true
          description: Submission identifier used to group this batch.
          schema:
            type: string
            minLength: 1
            maxLength: 12
        - name: correlation-id
          in: header
          required: true
          description: Correlation identifier for tracing.
          schema:
            type: string
            minLength: 1
        - name: subscription-id
          in: header
          required: true
          description: STC identifier used as downstream `stcId`.
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmissionBatchPayload'
      responses:
        '200':
          description: Batch accepted and processed into one or more charge outcomes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChargeResponseItem'
              examples:
                mixedSuccessAndFailure:
                  value:
                    - recordId: 1
                      utrn: "900459020010"
                      chargeTypeDescription: "Charge Type Description"
                      chargeReference: "XA001234567890"
                      chargeType: "STC"
                      chargeAmount: 0
                      chargeDueDate: "2026-03-14"
                    - recordId: 2
                      errorCode: "500"
                      errorText: "Failed to submit transfer to ETMP"
        '400':
          description: Validation failure for request headers/body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              examples:
                missingHeaders:
                  value:
                    error: "missing required headers: correlation-id and subscription-id"
                invalidPayload:
                  value:
                    error: "invalid transfer data"
                    details:
                      message: "request body must be valid JSON"
                emptyBatch:
                  value:
                    error: "at least one transfer must be provided"
                duplicateRecordIds:
                  value:
                    error: "recordIds must be unique"
        '500':
          description: Unexpected server error.
components:
  schemas:
    SubmissionBatchPayload:
      type: object
      required:
        - declaration
        - transfers
      properties:
        declaration:
          $ref: '#/components/schemas/SingleTransferDeclaration'
        transfers:
          type: array
          minItems: 1
          description: Must contain unique `recordId` values.
          items:
            $ref: '#/components/schemas/SingleTransferRequest'
      additionalProperties: false

    SingleTransferRequest:
      type: object
      required:
        - recordId
        - transactionDetails
        - mainSellerDetails
        - mainBuyerDetails
      properties:
        recordId:
          type: integer
          minimum: 1
          maximum: 99999
        transactionDetails:
          $ref: '#/components/schemas/SingleTransferTransactionDetails'
        contingentDetails:
          type: array
          items:
            $ref: '#/components/schemas/SingleTransferContingentDetails'
        mainSellerDetails:
          $ref: '#/components/schemas/SingleTransferSellerDetails'
        otherSellers:
          type: array
          items:
            $ref: '#/components/schemas/SingleTransferOtherSellerName'
        mainBuyerDetails:
          $ref: '#/components/schemas/SingleTransferBuyerDetails'
        otherBuyers:
          type: array
          items:
            $ref: '#/components/schemas/SingleTransferOtherBuyerName'
        agentDetails:
          type: array
          items:
            $ref: '#/components/schemas/SingleTransferAgentDetails'
      additionalProperties: false

    SingleTransferTransactionDetails:
      type: object
      required:
        - transactionType
        - descriptionOfSecurity
        - numberOfShares
        - originalChargingPoint
        - considerationActual
        - isConnectedPartiesTransactions
        - companyName
      properties:
        transactionType:
          $ref: '#/components/schemas/TransferType'
        reasonForPurchase:
          $ref: '#/components/schemas/ReasonForPurchase'
        descriptionOfSecurity:
          type: string
          minLength: 1
          maxLength: 255
        numberOfShares:
          type: integer
          minimum: 1
          maximum: 999999999
        nominalValue:
          type: number
        marketValue:
          type: number
        qualifyAsTreasuryShares:
          type: boolean
        maxPricePaid:
          type: number
        minPricePaid:
          type: number
        originalChargingPoint:
          type: string
          format: date
        considerationActual:
          type: number
        isConnectedPartiesTransactions:
          type: boolean
        companyName:
          type: string
          minLength: 1
          maxLength: 105
        companyRegistrationNumber:
          type: string
          minLength: 1
          maxLength: 8
        reliefClaimedName:
          type: string
          minLength: 1
          maxLength: 255
        reliefPercentage:
          type: integer
          minimum: 1
          maximum: 100
      additionalProperties: false

    SingleTransferContingentDetails:
      type: object
      required:
        - provisionalDate
        - isAmountUnasertainable
        - defermentOfPayment
      properties:
        provisionalDate:
          type: string
          format: date
        isAmountUnasertainable:
          type: boolean
        unascertainableAmount:
          type: number
        ascertainableAmount:
          type: number
        defermentOfPayment:
          type: boolean
        originalDefermentDate:
          type: string
          format: date
      additionalProperties: false

    SingleTransferSellerDetails:
      type: object
      required:
        - sellerName
        - addr1
        - postcode
        - country
      properties:
        sellerName:
          type: string
          minLength: 1
          maxLength: 40
        addr1:
          type: string
          minLength: 1
          maxLength: 100
        addr2:
          type: string
          minLength: 1
          maxLength: 40
        addr3:
          type: string
          minLength: 1
          maxLength: 40
        addr4:
          type: string
          minLength: 1
          maxLength: 40
        postcode:
          type: string
          minLength: 1
          maxLength: 10
        country:
          type: string
          minLength: 1
          maxLength: 100
      additionalProperties: false

    SingleTransferOtherSellerName:
      type: object
      required:
        - sellerName
      properties:
        sellerName:
          type: string
          minLength: 1
          maxLength: 40
      additionalProperties: false

    SingleTransferBuyerDetails:
      type: object
      required:
        - buyerName
        - addr1
        - postcode
        - country
        - email
        - taxRate
      properties:
        buyerName:
          type: string
          minLength: 1
          maxLength: 40
        addr1:
          type: string
          minLength: 1
          maxLength: 100
        addr2:
          type: string
          minLength: 1
          maxLength: 40
        addr3:
          type: string
          minLength: 1
          maxLength: 40
        addr4:
          type: string
          minLength: 1
          maxLength: 40
        postcode:
          type: string
          minLength: 1
          maxLength: 10
        country:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
        uniqueId:
          type: string
          minLength: 1
          maxLength: 10
        taxRate:
          $ref: '#/components/schemas/BuyerTaxRate'
        isPLC:
          type: boolean
      additionalProperties: false

    SingleTransferOtherBuyerName:
      type: object
      required:
        - buyerName
      properties:
        buyerName:
          type: string
          minLength: 1
          maxLength: 40
      additionalProperties: false

    SingleTransferAgentDetails:
      type: object
      required:
        - name
        - addr1
        - postcode
        - country
        - phone
        - email
        - clientReference
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 40
        addr1:
          type: string
          minLength: 1
          maxLength: 100
        addr2:
          type: string
          minLength: 1
          maxLength: 40
        addr3:
          type: string
          minLength: 1
          maxLength: 40
        addr4:
          type: string
          minLength: 1
          maxLength: 40
        postcode:
          type: string
          minLength: 1
          maxLength: 10
        country:
          type: string
          minLength: 1
          maxLength: 100
        phone:
          type: string
          minLength: 1
          maxLength: 30
        email:
          type: string
          format: email
        clientReference:
          type: string
          minLength: 1
          maxLength: 255
      additionalProperties: false

    SingleTransferDeclaration:
      type: object
      required:
        - name
        - addr1
        - postcode
        - country
        - isCorrectInfo
      properties:
        role1:
          $ref: '#/components/schemas/DeclarationRole'
        role2:
          type: string
          minLength: 1
          maxLength: 100
        name:
          type: string
          minLength: 1
          maxLength: 40
        addr1:
          type: string
          minLength: 1
          maxLength: 100
        addr2:
          type: string
          minLength: 1
          maxLength: 40
        addr3:
          type: string
          minLength: 1
          maxLength: 40
        addr4:
          type: string
          minLength: 1
          maxLength: 40
        postcode:
          type: string
          minLength: 1
          maxLength: 10
        country:
          type: string
          minLength: 1
          maxLength: 100
        selfDeclarationAgent:
          type: boolean
        isCorrectInfo:
          type: boolean
      additionalProperties: false

    TransferType:
      type: integer
      enum: [1, 2, 3]
      description: 1 = STF, 2 = SH03, 3 = Other

    ReasonForPurchase:
      type: integer
      enum: [1, 2, 3]
      description: 1 = PurchasedForCancellation, 2 = PurchasedToPlaceIntoTreasury, 3 = Both

    BuyerTaxRate:
      type: integer
      enum: [1, 2]
      description: 1 = 0.5%, 2 = 1.5%

    DeclarationRole:
      type: string
      enum: ["1", "2", "3", "4", "5", "6", "7", "8"]

    ChargeResponseItem:
      oneOf:
        - $ref: '#/components/schemas/StcChargeSuccess'
        - $ref: '#/components/schemas/StcChargeFailure'

    StcChargeSuccess:
      type: object
      required:
        - recordId
        - utrn
        - chargeTypeDescription
        - chargeReference
        - chargeType
        - chargeAmount
        - chargeDueDate
      properties:
        recordId:
          type: integer
        utrn:
          type: string
        chargeTypeDescription:
          type: string
        chargeReference:
          type: string
        chargeType:
          type: string
        chargeAmount:
          type: number
        chargeDueDate:
          type: string
          format: date
      additionalProperties: false

    StcChargeFailure:
      type: object
      required:
        - recordId
        - errorCode
        - errorText
      properties:
        recordId:
          type: integer
        errorCode:
          type: string
        errorText:
          type: string
      additionalProperties: false

    ApiErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
        details:
          description: Optional structured validation details.
          nullable: true
      additionalProperties: false
