---
openapi: "3.0.1"
info:
  title: "Securities Transfer Charge Submissions API"
  description: "This API specification describes the operations to submit securities transfer charge details for processing. The service allows taxpayers to submit one or more transfer details in a batch payload for calculation of securities transfer charges.\n\n**Key Features:**\n- Submit multiple transfer details in a single batch\n- Calculate securities transfer charges\n- Handle both successful and failed transfer processing\n- Support for various transfer types and buyer tax rates"
  version: "1.0.0"
  license:
    name: "Apache 2.0"
    url: "http://www.apache.org/licenses/LICENSE-2.0"
  contact:
    name: "HMRC Digital"
    email: "support@hmrc.gov.uk"
  x-integration-catalogue:
    api-type: "SIMPLE"
    backends:
    - "MDTP"
    domain: "2.0"
    platform: "MDTP"
    publisher-reference: "EPID 1631 - STC Submissions API"
    reviewed-date: "2026-04-20T00:00:00Z"
    short-description: "Securities Transfer Charge Submissions API"
    status: "BETA"
    sub-domain: "2.26"
servers:
- url: "securities-transfer-charge-submissions.protected.mdtp"
  description: "MDTP route"
tags:
- name: "Securities Transfer Charge Submissions"
  description: "Operations for submitting securities transfer charge details"
paths:
  /securities-transfer-charge-submissions/submission/{submissionId}:
    post:
      deprecated: false
      summary: "Submit securities transfer charge details for processing"
      description: "This operation allows taxpayers to submit one or more securities transfer details for calculation of transfer charges. The submission is processed synchronously and returns charge information for each transfer.\n\n**Validation:**\n- Both `correlation-id` and `subscription-id` headers are required\n- Request body must be valid JSON conforming to SubmissionBatchPayload schema\n- At least one transfer must be provided\n- All recordIds must be unique\n\n**Response:**\n- Returns 200 with an array of charge results (success or failure) for each transfer\n- Each result includes the original recordId for correlation"
      operationId: "submitSecuritiesTransferCharges"
      tags:
      - "Securities Transfer Charge Submissions"
      parameters:
      - name: "submissionId"
        in: "path"
        description: "Unique identifier for the submission batch"
        required: true
        deprecated: false
        allowEmptyValue: false
        style: "simple"
        schema:
          type: "string"
          minLength: 1
          maxLength: 50
        example: "sub-001"
      - name: "correlation-id"
        in: "header"
        description: "Unique alphanumeric ID for traceability and debugging. Must be generated by the originating system."
        required: true
        deprecated: false
        allowEmptyValue: false
        style: "simple"
        schema:
          type: "string"
          pattern: "^[a-zA-Z0-9\\-_]{1,36}$"
        example: "f0bd1f32-de51-45cc-9b18-0520d6e3ab1a"
      - name: "subscription-id"
        in: "header"
        description: "Identifier for the subscription associated with the submission"
        required: true
        deprecated: false
        allowEmptyValue: false
        style: "simple"
        schema:
          type: "string"
          minLength: 1
          maxLength: 50
        example: "sub-id-001"
      requestBody:
        description: "Batch payload containing declaration and transfer details"
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmissionBatchPayload"
            examples:
              singleTransfer:
                summary: "Single transfer submission"
                value:
                  declaration:
                    role1: "1"
                    name: "Declarant Name"
                    addr1: "123 Main Street"
                    postcode: "AB12CD"
                    country: "GB"
                    isCorrectInfo: true
                  transfers:
                  - recordId: 1
                    transactionDetails:
                      transactionType: 1
                      typeOfSecurity: "Ordinary Shares"
                      numberOfShares: 100
                      originalChargingPoint: "2026-01-15"
                      considerationActual: 5000
                      isConnectedPartiesTransactions: false
                      companyName: "Test Corporation"
                    mainSellerDetails:
                      sellerName: "Seller Name"
                      addr1: "100 Seller Lane"
                      postcode: "AB12CD"
                      country: "GB"
                    mainBuyerDetails:
                      buyerName: "Buyer Name"
                      addr1: "50 Buyer Road"
                      postcode: "AB12CD"
                      country: "GB"
                      email: "buyer@example.com"
                      taxRate: 1
              multipleTransfers:
                summary: "Multiple transfers submission"
                value:
                  declaration:
                    role1: "1"
                    name: "Declarant Name"
                    addr1: "123 Main Street"
                    postcode: "AB12CD"
                    country: "GB"
                    isCorrectInfo: true
                  transfers:
                  - recordId: 1
                    transactionDetails:
                      transactionType: 1
                      typeOfSecurity: "Ordinary Shares"
                      numberOfShares: 100
                      originalChargingPoint: "2026-01-15"
                      considerationActual: 5000
                      isConnectedPartiesTransactions: false
                      companyName: "Test Corporation"
                    mainSellerDetails:
                      sellerName: "Seller Name"
                      addr1: "100 Seller Lane"
                      postcode: "AB12CD"
                      country: "GB"
                    mainBuyerDetails:
                      buyerName: "Buyer Name"
                      addr1: "50 Buyer Road"
                      postcode: "AB12CD"
                      country: "GB"
                      email: "buyer@example.com"
                      taxRate: 1
                  - recordId: 2
                    transactionDetails:
                      transactionType: 2
                      typeOfSecurity: "Preference Shares"
                      numberOfShares: 200
                      originalChargingPoint: "2026-02-20"
                      considerationActual: 10000
                      isConnectedPartiesTransactions: true
                      companyName: "Another Corporation"
                    mainSellerDetails:
                      sellerName: "Another Seller"
                      addr1: "200 Seller Street"
                      postcode: "CD34EF"
                      country: "GB"
                    mainBuyerDetails:
                      buyerName: "Another Buyer"
                      addr1: "75 Buyer Avenue"
                      postcode: "EF56GH"
                      country: "GB"
                      email: "another.buyer@example.com"
                      taxRate: 2
      responses:
        "200":
          description: "Submission processed successfully"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/SingleTransferResponse"
              examples:
                successfulCharges:
                  summary: "Successful charge calculations"
                  value:
                  - recordId: 1
                    utrn: "12345678"
                    chargeTypeDescription: "Securities Transfer Charge"
                    chargeReference: "XREF123"
                    chargeType: "STC"
                    chargeAmount: 100.00
                    chargeDueDate: "2026-05-09"
                  - recordId: 2
                    utrn: "87654321"
                    chargeTypeDescription: "Securities Transfer Charge"
                    chargeReference: "XREF124"
                    chargeType: "STC"
                    chargeAmount: 200.00
                    chargeDueDate: "2026-05-09"
                mixedResults:
                  summary: "Mixed successful and failed transfers"
                  value:
                  - recordId: 1
                    utrn: "12345678"
                    chargeTypeDescription: "Securities Transfer Charge"
                    chargeReference: "XREF123"
                    chargeType: "STC"
                    chargeAmount: 100.00
                    chargeDueDate: "2026-05-09"
                  - recordId: 2
                    errorCode: "400"
                    errorText: "Invalid request"
        "400":
          description: "Bad request - validation error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missingHeaders:
                  summary: "Missing required headers"
                  value:
                    error: "invalid transfer data"
                    details:
                    - message: "missing required headers: correlation-id and subscription-id"
                emptyTransfers:
                  summary: "Empty transfers array"
                  value:
                    error: "invalid transfer data"
                    details:
                    - message: "at least one transfer must be provided"
                duplicateRecordIds:
                  summary: "Duplicate record IDs"
                  value:
                    error: "invalid transfer data"
                    details:
                    - message: "recordIds must be unique"
                invalidJson:
                  summary: "Invalid JSON structure"
                  value:
                    error: "invalid transfer data"
                    details:
                    - obj:
                        declaration:
                        - obj:
                            role1:
                            - errors:
                              - error: "error.expected.jsstring"
        "500":
          description: "Internal server error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    SubmissionBatchPayload:
      type: "object"
      required:
      - "declaration"
      - "transfers"
      properties:
        declaration:
          $ref: "#/components/schemas/SingleTransferDeclaration"
        transfers:
          type: "array"
          items:
            $ref: "#/components/schemas/SingleTransferRequest"
          minItems: 1
          description: "Array of transfer details to be processed"
      description: "Container for declaration and transfer details in a batch submission"
    SingleTransferDeclaration:
      type: "object"
      required:
      - "name"
      - "addr1"
      - "postcode"
      - "country"
      - "isCorrectInfo"
      properties:
        role1:
          $ref: "#/components/schemas/DeclarationRole"
        role2:
          type: "string"
          maxLength: 100
          description: "Secondary role description"
        name:
          type: "string"
          minLength: 1
          maxLength: 100
          description: "Full name of the declarant"
        addr1:
          type: "string"
          minLength: 1
          maxLength: 100
          description: "First line of address"
        addr2:
          type: "string"
          maxLength: 100
          description: "Second line of address"
        addr3:
          type: "string"
          maxLength: 100
          description: "Third line of address"
        addr4:
          type: "string"
          maxLength: 100
          description: "Fourth line of address"
        postcode:
          type: "string"
          minLength: 1
          maxLength: 10
          description: "Postal code"
        country:
          type: "string"
          minLength: 2
          maxLength: 2
          description: "ISO 3166-1 alpha-2 country code"
        selfDeclarationAgent:
          type: "boolean"
          description: "Whether the declarant is acting as an agent"
        isCorrectInfo:
          type: "boolean"
          description: "Declaration that the information provided is correct"
      description: "Declaration details for the securities transfer submission"
    SingleTransferRequest:
      type: "object"
      required:
      - "recordId"
      - "transactionDetails"
      - "mainSellerDetails"
      - "mainBuyerDetails"
      properties:
        recordId:
          type: "integer"
          minimum: 1
          description: "Unique identifier for this transfer within the batch"
        transactionDetails:
          $ref: "#/components/schemas/SingleTransferTransactionDetails"
        contingentDetails:
          type: "array"
          items:
            $ref: "#/components/schemas/SingleTransferContingentDetails"
          description: "Contingent transaction details"
        mainSellerDetails:
          $ref: "#/components/schemas/SingleTransferSellerDetails"
        otherSellers:
          type: "array"
          items:
            $ref: "#/components/schemas/SingleTransferOtherSellerName"
          description: "Additional sellers involved in the transaction"
        mainBuyerDetails:
          $ref: "#/components/schemas/SingleTransferBuyerDetails"
        otherBuyers:
          type: "array"
          items:
            $ref: "#/components/schemas/SingleTransferOtherBuyerName"
          description: "Additional buyers involved in the transaction"
        agentDetails:
          type: "array"
          items:
            $ref: "#/components/schemas/SingleTransferAgentDetails"
          description: "Agent details if applicable"
      description: "Details for a single securities transfer"
    SingleTransferTransactionDetails:
      type: "object"
      required:
      - "transactionType"
      - "typeOfSecurity"
      - "numberOfShares"
      - "originalChargingPoint"
      - "considerationActual"
      - "isConnectedPartiesTransactions"
      - "companyName"
      properties:
        transactionType:
          $ref: "#/components/schemas/TransferType"
        reasonForPurchase:
          $ref: "#/components/schemas/ReasonForPurchase"
        typeOfSecurity:
          type: "string"
          minLength: 1
          maxLength: 100
          description: "Description of the type of security being transferred"
        numberOfShares:
          type: "integer"
          minimum: 1
          description: "Number of shares being transferred"
        nominalValue:
          type: "number"
          minimum: 0
          description: "Nominal value per share"
        marketValue:
          type: "number"
          minimum: 0
          description: "Market value per share"
        qualifyAsTreasuryShares:
          type: "boolean"
          description: "Whether the shares qualify as treasury shares"
        maxPricePaid:
          type: "number"
          minimum: 0
          description: "Maximum price paid per share"
        minPricePaid:
          type: "number"
          minimum: 0
          description: "Minimum price paid per share"
        originalChargingPoint:
          type: "string"
          format: "date"
          description: "Date when the charge originally applied"
        considerationActual:
          type: "number"
          minimum: 0
          description: "Actual consideration amount"
        isConnectedPartiesTransactions:
          type: "boolean"
          description: "Whether this is a connected parties transaction"
        companyName:
          type: "string"
          minLength: 1
          maxLength: 100
          description: "Name of the company whose shares are being transferred"
        companyRegistrationNumber:
          type: "string"
          maxLength: 20
          description: "Company registration number"
        reliefClaimedName:
          type: "string"
          maxLength: 100
          description: "Name of the relief being claimed"
        reliefPercentage:
          type: "integer"
          minimum: 0
          maximum: 100
          description: "Percentage of relief claimed"
      description: "Transaction-specific details for the securities transfer"
    SingleTransferContingentDetails:
      type: "object"
      required:
      - "provisionalDate"
      - "isAmountUnasertainable"
      - "defermentOfPayment"
      properties:
        provisionalDate:
          type: "string"
          format: "date"
          description: "Provisional date for contingent transaction"
        isAmountUnasertainable:
          type: "boolean"
          description: "Whether the amount is ascertainable"
        unascertainableAmount:
          type: "number"
          minimum: 0
          description: "Unascertainable amount"
        ascertainableAmount:
          type: "number"
          minimum: 0
          description: "Ascertainable amount"
        defermentOfPayment:
          type: "boolean"
          description: "Whether payment is deferred"
        originalDefermentDate:
          type: "string"
          format: "date"
          description: "Original deferment date"
      description: "Contingent transaction details"
    SingleTransferSellerDetails:
      type: "object"
      required:
      - "sellerName"
      - "addr1"
      - "postcode"
      - "country"
      properties:
        sellerName:
          type: "string"
          minLength: 1
          maxLength: 100
          description: "Name of the seller"
        addr1:
          type: "string"
          minLength: 1
          maxLength: 100
          description: "First line of seller's address"
        addr2:
          type: "string"
          maxLength: 100
          description: "Second line of seller's address"
        addr3:
          type: "string"
          maxLength: 100
          description: "Third line of seller's address"
        addr4:
          type: "string"
          maxLength: 100
          description: "Fourth line of seller's address"
        postcode:
          type: "string"
          minLength: 1
          maxLength: 10
          description: "Seller's postal code"
        country:
          type: "string"
          minLength: 2
          maxLength: 2
          description: "Seller's country (ISO 3166-1 alpha-2)"
      description: "Details of the main seller"
    SingleTransferOtherSellerName:
      type: "object"
      required:
      - "sellerName"
      properties:
        sellerName:
          type: "string"
          minLength: 1
          maxLength: 100
          description: "Name of additional seller"
      description: "Name of an additional seller"
    SingleTransferBuyerDetails:
      type: "object"
      required:
      - "buyerName"
      - "addr1"
      - "postcode"
      - "country"
      - "email"
      - "taxRate"
      properties:
        buyerName:
          type: "string"
          minLength: 1
          maxLength: 100
          description: "Name of the buyer"
        addr1:
          type: "string"
          minLength: 1
          maxLength: 100
          description: "First line of buyer's address"
        addr2:
          type: "string"
          maxLength: 100
          description: "Second line of buyer's address"
        addr3:
          type: "string"
          maxLength: 100
          description: "Third line of buyer's address"
        addr4:
          type: "string"
          maxLength: 100
          description: "Fourth line of buyer's address"
        postcode:
          type: "string"
          minLength: 1
          maxLength: 10
          description: "Buyer's postal code"
        country:
          type: "string"
          minLength: 2
          maxLength: 2
          description: "Buyer's country (ISO 3166-1 alpha-2)"
        email:
          type: "string"
          format: "email"
          minLength: 1
          maxLength: 100
          description: "Buyer's email address"
        uniqueId:
          type: "string"
          maxLength: 50
          description: "Unique identifier for the buyer"
        taxRate:
          $ref: "#/components/schemas/BuyerTaxRate"
        isPLC:
          type: "boolean"
          description: "Whether the buyer is a Public Limited Company"
      description: "Details of the main buyer"
    SingleTransferOtherBuyerName:
      type: "object"
      required:
      - "buyerName"
      properties:
        buyerName:
          type: "string"
          minLength: 1
          maxLength: 100
          description: "Name of additional buyer"
      description: "Name of an additional buyer"
    SingleTransferAgentDetails:
      type: "object"
      required:
      - "name"
      - "addr1"
      - "postcode"
      - "country"
      - "phone"
      - "email"
      - "clientReference"
      properties:
        name:
          type: "string"
          minLength: 1
          maxLength: 100
          description: "Name of the agent"
        addr1:
          type: "string"
          minLength: 1
          maxLength: 100
          description: "First line of agent's address"
        addr2:
          type: "string"
          maxLength: 100
          description: "Second line of agent's address"
        addr3:
          type: "string"
          maxLength: 100
          description: "Third line of agent's address"
        addr4:
          type: "string"
          maxLength: 100
          description: "Fourth line of agent's address"
        postcode:
          type: "string"
          minLength: 1
          maxLength: 10
          description: "Agent's postal code"
        country:
          type: "string"
          minLength: 2
          maxLength: 2
          description: "Agent's country (ISO 3166-1 alpha-2)"
        phone:
          type: "string"
          minLength: 1
          maxLength: 20
          description: "Agent's phone number"
        email:
          type: "string"
          format: "email"
          minLength: 1
          maxLength: 100
          description: "Agent's email address"
        clientReference:
          type: "string"
          minLength: 1
          maxLength: 50
          description: "Client reference for the agent"
      description: "Details of the agent involved in the transaction"
    SingleTransferResponse:
      oneOf:
      - $ref: "#/components/schemas/StcChargeSuccess"
      - $ref: "#/components/schemas/StcChargeFailure"
      discriminator:
        propertyName: "recordId"
        mapping:
          success: "#/components/schemas/StcChargeSuccess"
          failure: "#/components/schemas/StcChargeFailure"
      description: "Response for a single transfer - either successful charge calculation or failure"
    StcChargeSuccess:
      type: "object"
      required:
      - "recordId"
      - "utrn"
      - "chargeTypeDescription"
      - "chargeReference"
      - "chargeType"
      - "chargeAmount"
      - "chargeDueDate"
      properties:
        recordId:
          type: "integer"
          minimum: 1
          description: "Unique identifier for this transfer (matches request)"
        utrn:
          type: "string"
          minLength: 1
          maxLength: 20
          description: "Unique Tax Reference Number for the charge"
        chargeTypeDescription:
          type: "string"
          minLength: 1
          maxLength: 100
          description: "Human-readable description of the charge type"
        chargeReference:
          type: "string"
          minLength: 1
          maxLength: 20
          description: "Reference number for the charge"
        chargeType:
          type: "string"
          minLength: 1
          maxLength: 10
          description: "Code representing the charge type"
        chargeAmount:
          type: "number"
          minimum: 0
          description: "Amount of the charge in pounds"
        chargeDueDate:
          type: "string"
          format: "date"
          description: "Date when the charge is due"
      description: "Successful charge calculation result"
    StcChargeFailure:
      type: "object"
      required:
      - "recordId"
      - "errorCode"
      - "errorText"
      properties:
        recordId:
          type: "integer"
          minimum: 1
          description: "Unique identifier for this transfer (matches request)"
        errorCode:
          type: "string"
          minLength: 1
          maxLength: 10
          description: "Error code indicating the type of failure"
        errorText:
          type: "string"
          minLength: 1
          maxLength: 500
          description: "Human-readable description of the error"
      description: "Failed transfer processing result"
    DeclarationRole:
      type: "string"
      enum:
      - "1"
      - "2"
      - "3"
      - "4"
      - "5"
      - "6"
      - "7"
      - "8"
      description: "Role of the declarant"
      x-enum-descriptions:
        "1": "Director"
        "2": "Secretary"
        "3": "Person Authorised"
        "4": "Administrator"
        "5": "Receiver"
        "6": "Receiver Manager"
        "7": "CIC Manager"
        "8": "UK Societas"
    TransferType:
      type: "integer"
      enum:
      - 1
      - 2
      - 3
      description: "Type of securities transfer"
      x-enum-descriptions:
        1: "STF (Securities Transfer Form)"
        2: "SH03 (Share Transfer Form)"
        3: "Other"
    ReasonForPurchase:
      type: "integer"
      enum:
      - 1
      - 2
      - 3
      description: "Reason for purchasing the securities"
      x-enum-descriptions:
        1: "Purchased for cancellation"
        2: "Purchased to place into treasury"
        3: "Both"
    BuyerTaxRate:
      type: "integer"
      enum:
      - 1
      - 2
      description: "Tax rate applicable to the buyer"
      x-enum-descriptions:
        1: "0.5%"
        2: "1.5%"
    ErrorResponse:
      type: "object"
      required:
      - "error"
      - "details"
      properties:
        error:
          type: "string"
          description: "Error type identifier"
        details:
          type: "array"
          items:
            oneOf:
            - type: "object"
              required:
              - "message"
              properties:
                message:
                  type: "string"
                  description: "Human-readable error message"
            - type: "object"
              required:
              - "obj"
              properties:
                obj:
                  type: "object"
                  description: "Detailed error object from JSON validation"
          description: "Array of error details"
      description: "Error response structure"
